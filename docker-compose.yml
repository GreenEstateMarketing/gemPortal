version: "3.8"

services:

  gemapp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gemapp
    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env

    environment:
      DB_HOST: gemdb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_STRICT: ${DB_STRICT:-false}

    volumes:
      - ./:/var/www/html
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache

    depends_on:
      gemdb:
        condition: service_healthy

    networks:
      - gem

  nginx:
    image: nginx:1.27-alpine

    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - gemapp

    networks:
      - gem

  gemdb:
    image: mysql:8.0

    container_name: gemdb
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    volumes:
      - gemdb_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - gem

networks:
  gem:
    name: gem
    driver: bridge

volumes:
  gemdb_data:
    name: gemdb_data

  laravel_storage:
    name: laravel_storage

  laravel_cache:
    name: laravel_cache